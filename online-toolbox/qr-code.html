<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="免费在线二维码生成器：输入网址或文字，一键生成高清二维码图片，可保存下载，无需注册登录。">
<title>在线二维码生成器 - 免费制作网址/文字二维码</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
</head>
<body>
<header><h1><a href="/">🧰 在线工具箱</a></h1><p>免费 · 无需注册 · 打开即用</p></header>
<main>
<section class="tool">
  <h2>二维码生成器</h2>
  <p class="desc">输入文字或链接，一键生成二维码，右键图片即可保存。</p>
  <input id="qr-text" placeholder="输入网址或文字，如 https://example.com" style="width:100%">
  <button class="btn" onclick="makeQR()">生成二维码</button>
  <div class="qr-img" id="qr-box" style="display:none"></div>
</section>
<article class="seo">
  <h3>关于在线二维码生成器</h3>
  <p>本工具完全在浏览器本地生成二维码，您输入的内容不会上传到任何服务器，安全放心。生成的二维码可长期使用，适合制作名片二维码、Wi-Fi 分享二维码、网址跳转二维码等场景。</p>
  <h3>常见问题</h3>
  <p>问：二维码会过期吗？答：不会，只要内容不变，二维码永久有效。问：支持中文吗？答：支持，中文、网址、电话号码均可生成。</p>
</article>
</main>
<div class="ad-slot">广告位（接入 Google AdSense 后替换）</div>
<footer><a href="/">← 返回工具箱首页</a><br>© 2026 在线工具箱</footer>
<script>
function makeQR(){
  const t=document.getElementById('qr-text').value.trim();
  const box=document.getElementById('qr-box');
  if(!t){alert('请先输入内容');return}
  box.style.display='inline-block';box.innerHTML='';
  try{const qr=qrcode(0,'M');qr.addData(t);qr.make();box.innerHTML=qr.createImgTag(6,12);}
  catch(e){box.innerHTML='内容过长，无法生成'}
}
</script>
</body>
</html>
