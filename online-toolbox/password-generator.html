<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="免费高强度密码生成器：自定义长度、包含数字和符号，使用浏览器加密随机数本地生成，绝不上传，一键复制。">
<title>随机密码生成器 - 高强度安全密码在线生成</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><h1><a href="/">🧰 在线工具箱</a></h1><p>免费 · 无需注册 · 打开即用</p></header>
<main>
<section class="tool">
  <h2>密码生成器</h2>
  <p class="desc">使用浏览器加密级随机数（crypto.getRandomValues）本地生成，绝不上传。</p>
  <div class="row">
    <label>长度 <input id="p-len" type="number" value="16" min="6" max="64" style="width:80px"></label>
    <label><input type="checkbox" id="p-num" checked> 数字</label>
    <label><input type="checkbox" id="p-sym" checked> 符号</label>
  </div>
  <button class="btn" onclick="makePwd()">生成密码</button>
  <div class="result" id="p-result"></div>
</section>
<article class="seo">
  <h3>什么样的密码才安全？</h3>
  <p>安全专家建议密码至少 12 位以上，混合大小写字母、数字和符号，且不同网站使用不同密码。本工具生成的密码完全在您的设备上随机产生，网络层面无法被截获。强烈建议配合密码管理器使用。</p>
</article>
</main>
<div class="ad-slot">广告位（接入 Google AdSense 后替换）</div>
<footer><a href="/">← 返回工具箱首页</a><br>© 2026 在线工具箱</footer>
<script>
function makePwd(){
  const len=Math.min(64,Math.max(6,parseInt(document.getElementById('p-len').value)||16));
  let chars='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if(document.getElementById('p-num').checked)chars+='0123456789';
  if(document.getElementById('p-sym').checked)chars+='!@#$%^&*-_=+?';
  const arr=new Uint32Array(len);crypto.getRandomValues(arr);
  const pwd=[...arr].map(x=>chars[x%chars.length]).join('');
  const el=document.getElementById('p-result');
  el.style.display='block';
  el.innerHTML=`<span style="font-family:monospace;font-size:18px">${pwd}</span><br><button class="btn" style="margin-top:8px" onclick="navigator.clipboard.writeText('${pwd}');this.textContent='已复制 ✓'">复制</button>`;
}
makePwd();
</script>
</body>
</html>
